[project]
name = "lha-virtual-simulation-training-system-python"
version = "0.1.0"
description = "UDP hand tracking sender for Unity range-hood training simulator"
readme = "README.md"
authors = [
    { name = "heyongqi10", email = "heyongqi10@jd.com" }
]
requires-python = ">=3.9,<3.10"
dependencies = [
    "opencv-python>=4.8,<5",
    "mediapipe>=0.10.9,<0.10.15",
    "numpy>=1.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lha_virtual_simulation_training_system_python"]

[tool.uv]
package = false
