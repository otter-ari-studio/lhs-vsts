packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@rstest/coverage-istanbul": ^0.12.2
  "@types/node": ^24
  "@vitest/coverage-v8": 5.0.1
  playwright: ^1.63.0
  "@playwright/test": ^1.63.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  vitest: 5.0.1
  "@nestjs/serve-static": ^12.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
